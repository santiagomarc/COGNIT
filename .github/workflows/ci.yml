name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders. env-public.ts validates these at import
          # time and throws without them, so the build cannot run unset.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://example.com

      # First-load JS per route, gzip; exits 1 on any overrun or unknown route
      # (COGNIT_NEXT_HORIZON_PLAN.md §5.6). Budgets move down, never up, without a written reason.
      - name: Bundle budgets
        run: node scripts/bundle-report.mjs .next --budgets scripts/bundle-budgets.json

  # Every migration replayed on a fresh Postgres, and the committed types
  # compared with what that schema generates (plan §6.5). It proves ordering
  # and syntax, not hosted permissions: the local `postgres` role may hold
  # privileges the hosted one lacks, which production-assertions.sql covers.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Replay every migration on a fresh database
        run: supabase db start && supabase db reset --local

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The committed file comes from the hosted project's generator, which
      # pretty-prints; the local CLI's does not. Both are run through one
      # pinned Prettier, then comments, blank lines and __InternalSupabase
      # (the server's PostgrestVersion, not the schema's) are dropped, so only
      # schema differences fail the step.
      # On a mismatch the diff goes to the run summary and to annotations
      # (the failure email and the public API show those; job logs need a
      # signed-in viewer).
      - name: Types match the replayed schema
        run: |
          supabase gen types typescript --local --schema public > /tmp/types.ts
          normalize() {
            npx -y prettier@3.6.2 --no-config --stdin-filepath types.ts < "$1" \
              | awk '/^[[:space:]]*__InternalSupabase: \{/ { if ($0 !~ /\}/) skip = 1; next } skip { if ($0 ~ /^[[:space:]]*\}/) skip = 0; next } { print }' \
              | grep -v -e '^[[:space:]]*//' -e '^[[:space:]]*$' \
              | sed 's/[[:space:]]*$//'
          }
          if diff -u <(normalize src/lib/database.types.ts) <(normalize /tmp/types.ts) > /tmp/types.diff; then
            exit 0
          fi
          { echo '### database.types.ts differs from the replayed schema'; echo '```diff'; cat /tmp/types.diff; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          split -l 60 /tmp/types.diff /tmp/types.diff.part.
          for part in $(ls /tmp/types.diff.part.* | head -9); do
            body=$(sed -e 's/%/%25/g' "$part" | awk '{printf "%s%%0A", $0}')
            echo "::error title=database.types.ts drift ($(basename "$part"))::$body"
          done
          exit 1
